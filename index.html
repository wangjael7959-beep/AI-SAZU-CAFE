<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 사주카페</title>
</head>
<body>
<h1>🔮 AI 사주카페</h1>
<p>생년월일과 태어난 시간을 입력하면 사주를 분석해드립니다.</p>
<form method="POST">
<label>이름</label><br>
<input type="text" name="name"><br><br>
<label>생년월일</label><br>
<input type="date" name="birthdate"><br><br>
<label>태어난 시간</label><br>
<input type="time" name="birthtime"><br><br>
<button type="submit">사주 보기</button>
</form>
</body>
</html>
